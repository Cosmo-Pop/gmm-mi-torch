[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gmm-mi-torch"
version = "0.11.0"
description = "PyTorch port of GMM-MI: mutual information with bootstrap errorbars from Gaussian mixture models, GPU-batched"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Hiranya Peiris", email = "hiranya.v.peiris@gmail.com" },
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
# numpy >= 2.0 for np.trapezoid; scipy for the rankdata/norm oracle tests
test = ["pytest", "numpy>=2.0", "scipy"]
# gmm_mi_torch.plotting imports these (torch's dependency tree does not
# guarantee numpy); the estimators themselves need only torch
plot = ["numpy", "matplotlib", "scipy"]
# docs/make_api_docs.py, which generates the API pages in docs/ (it imports
# gmm_mi_torch.plotting, hence the plotting dependencies)
docs = ["numpydoc", "numpy", "matplotlib", "scipy"]

[project.urls]
Homepage = "https://github.com/Cosmo-Pop/gmm-mi-torch"
Upstream = "https://github.com/dpiras/GMM-MI"

[tool.setuptools]
packages = ["gmm_mi_torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
